name: Deploy to Cloud Run

# Tag-based deploys: push a v*.*.* tag (via scripts/release_minor.sh) to ship.
# Keyless auth via Workload Identity Federation — no service-account JSON key.
# Mirrors the planning-poker pipeline (same GCP project `serbito`).
#
# Pipeline: verify (the release-script gate from ci.yaml, reused via workflow_call: ruff,
# manage.py check, pytest, landing parse) -> deploy (CHANGELOG.md section for the tag, build
# the Django + gunicorn image, Trivy gate, migrate job when migrations changed, Cloud Run).
# A tag pushed without scripts/release_minor.sh still cannot ship untested code (SERBITO-277)
# or ship without its release notes (SERBITO-389).
#
# SERBITO-401: weekly OS refresh. Every Wednesday 03:00 UTC (Cloud SQL maintenance is Tuesday
# 02:00 UTC) and on a manual run, the deploy job checks out the NEWEST vX.Y.Z tag and rebuilds it
# with today's APT_REFRESH, so Debian security fixes ship without a product release. It never
# deploys a branch, so unreleased code still cannot bypass the tag gate. verify does not run:
# the tag passed it at release, and main HEAD is not what ships.
on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "0 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for WIF / OIDC

# SERBITO-401: a refresh and a release never deploy at the same time; a new run waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: serbito
  REGION: europe-west1
  SERVICE: javi
  # Image repo. The step "Pick the release tag" sets IMAGE=AR_IMAGE:<commit sha> (a refresh
  # adds -r<YYYYMMDD>); the migration diff reads the live commit back from it.
  AR_IMAGE: europe-west1-docker.pkg.dev/serbito/javi/javi
  WIF_PROVIDER: projects/488744139718/locations/global/workloadIdentityPools/github-pool/providers/github
  DEPLOYER_SA: javi-deployer@serbito.iam.gserviceaccount.com
  # The service and the migrate job run as the same identity, with the same Cloud SQL
  # instance, secrets and env file — the job sees exactly the settings the app will.
  RUNTIME_SA: 488744139718-compute@developer.gserviceaccount.com
  CLOUDSQL_INSTANCE: serbito:europe-west1:serbitodb
  MIGRATE_JOB: javi-migrate
  RUN_SECRETS: SECRET_KEY=javi-secret-key:latest,DATABASE_URL=javi-database-url:latest,GOOGLE_MAPS_API_KEY=javi-google-maps-key:latest,INFOBIP_API_KEY=javi-infobip-key:latest,INFOBIP_WEBHOOK_SECRET=javi-infobip-webhook-secret:latest,TASKS_SECRET=javi-tasks-secret:latest,SENTRY_DSN=javi-sentry-dsn:latest,ADMIN_PATH=javi-admin-path:latest

jobs:
  verify: # Same gate as scripts/release_minor.sh (ci.yaml) — a tag never deploys without it
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read # no id-token here: this job runs dependency and test code, not the deploy

  deploy:
    runs-on: ubuntu-24.04 # явная версия: ubuntu-latest переезжает на 26.04 (2026-10-19)
    needs: verify # No tag deploy unless lint, system check and tests pass
    # A refresh (schedule / manual run) skips verify and redeploys an already verified tag.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && github.event_name != 'push')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned: supply-chain, Aikido)
        with:
          fetch-depth: 0 # full history + tags: the migration diff against the live commit
          persist-credentials: false # no step pushes; keep the token out of .git/config (SERBITO-385, Aikido)

      # SERBITO-401: which release this run deploys. A tag push deploys its own tag. A schedule
      # or manual run (a "refresh") checks out the newest vX.Y.Z tag; its image tag gets
      # -r<YYYYMMDD>, so the refreshed revision differs from the release image of the same
      # commit. Later steps read RELEASE_TAG and IMAGE (GITHUB_REF_NAME / github.sha are main
      # on a schedule run).
      - name: Pick the release tag
        id: release
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            mode=release
            suffix=""
          else
            tag="$(git tag --list 'v*.*.*' --sort=-v:refname \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !t { t = $0 } END { print t }')"
            if [ -z "$tag" ]; then
              echo "::error::No vX.Y.Z tag to redeploy."
              exit 1
            fi
            git -c advice.detachedHead=false checkout --quiet "refs/tags/$tag"
            mode=refresh
            suffix="-r$(date -u +%Y%m%d)"
          fi
          sha="$(git rev-parse HEAD)"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE=${AR_IMAGE}:${sha}${suffix}" >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag ($mode): ${AR_IMAGE}:${sha}${suffix}" | tee -a "$GITHUB_STEP_SUMMARY"

      # SERBITO-389: a tag ships only with its notes for shops. scripts/release_minor.sh writes the
      # "## [X.Y.Z] - date" section; a tag pushed by hand without it stops here, before the build.
      - name: CHANGELOG.md has this version
        run: |
          ver="${RELEASE_TAG#v}"
          if ! grep -qxE "## \[${ver//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$ver] - YYYY-MM-DD' section for tag $RELEASE_TAG. Release with scripts/release_minor.sh (README, Releasing)."
            exit 1
          fi
          echo "CHANGELOG.md has [$ver]"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3 (SHA-pinned)
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3 (SHA-pinned)

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (SHA-pinned)

      # SERBITO-369: the UTC date as a build arg. The Dockerfile's apt-get upgrade RUN reads
      # it, so the first build of each day gets fresh Debian security fixes.
      - name: Daily apt refresh key
        id: apt
        run: echo "refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (SHA-pinned)
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.refresh }}
          cache-from: type=registry,ref=${{ env.AR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.AR_IMAGE }}:buildcache,mode=max

      # --- Security: scan the built image for OS/dep CVEs + leaked secrets (parity with
      # serbito). Hard gate: a *fixed* HIGH/CRITICAL fails the deploy. Trivy comes from the
      # release tarball checked against a pinned sha256, not a downloaded install.sh piped to
      # sh (SERBITO-385, Aikido). New version = new hash from trivy_<ver>_checksums.txt. ---
      - name: Trivy image scan
        env:
          TRIVY_VERSION: 0.71.2
          TRIVY_SHA256: 0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460
        run: |
          set -euo pipefail
          curl -sfL --retry 3 -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy.tar.gz trivy
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --format table --timeout 10m \
            "$IMAGE"

      - name: Runtime env file
        run: |
          # SENTRY_RELEASE (javi@X.Y.Z из тега) дописываем в копию env-файла: gcloud не
          # разрешает сочетать --env-vars-file с --update-env-vars. Один файл на job и сервис.
          # Пересборка (SERBITO-401) оставляет релиз своего тега.
          cp .github/deploy.env.yaml "$RUNNER_TEMP/deploy.env.yaml"
          echo "SENTRY_RELEASE: \"javi@${RELEASE_TAG#v}\"" >> "$RUNNER_TEMP/deploy.env.yaml"

      # --- Migrations run in the deploy, not on container start (SERBITO-323) ---
      # Every cold start used to run `manage.py migrate` first (~28 starts a day, "No
      # migrations to apply"). Now the Cloud Run job $MIGRATE_JOB runs them, only when
      # migration files changed. Baseline = the commit the service runs now (its image tag),
      # not the previous tag: a tag whose deploy failed would otherwise hide its migrations
      # (serbito, 2026-09-07). Fail-safe: no job yet / no baseline / diff fails -> migrate.
      # A refreshed image tag is <sha>-r<YYYYMMDD> (SERBITO-401): the commit is the part before
      # the first "-", so a refresh of the live tag finds no migration change.
      - name: Detect pending migrations
        id: migrations
        run: |
          if ! gcloud run jobs describe "$MIGRATE_JOB" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "Job $MIGRATE_JOB not found — it is created and run (fail-safe)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIVE_IMAGE="$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"
          LIVE_SHA="${LIVE_IMAGE##*:}"
          LIVE_SHA="${LIVE_SHA%%-*}"
          if [ -n "$LIVE_SHA" ] && git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            BASE="$LIVE_SHA"
            echo "Baseline: the commit the service runs now ($BASE)."
          else
            BASE="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            echo "Live image unusable ('$LIVE_IMAGE') — baseline: previous tag ${BASE:-<none>}."
          fi
          if [ -z "$BASE" ] || ! FILES="$(git diff --name-only "$BASE" HEAD)"; then
            echo "No usable baseline — running migrations (fail-safe)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(printf '%s\n' "$FILES" | grep -E '(^|/)migrations/[^/]+\.py$' | grep -v '/__init__\.py$' || true)"
          if [ -n "$CHANGED" ]; then
            printf 'Migration files changed since %s:\n%s\n' "$BASE" "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration files changed since $BASE — skipping $MIGRATE_JOB."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs BEFORE the service deploy moves traffic: a failed migration fails this step, and
      # the new revision never ships (the old one keeps serving). So migrations must stay
      # compatible with the running code (add first, drop in a later release). The job is
      # created or updated to the new image each time (idempotent) and executed; --wait
      # makes gcloud exit non-zero if the execution fails. No retries: a half-applied
      # migration needs a human, not a replay.
      - name: Migrate database (Cloud Run job)
        if: steps.migrations.outputs.changed == 'true'
        run: |
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --env-vars-file "$RUNNER_TEMP/deploy.env.yaml" \
            --set-secrets "$RUN_SECRETS" \
            --command=python \
            --args=manage.py,migrate,--noinput \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 10m \
            --cpu 1 \
            --memory 512Mi \
            --execute-now \
            --wait

      # SERBITO-401: the revision that serves 100% now. The smoke check after the deploy routes
      # traffic back to it if the main page fails. Empty = nothing to roll back to.
      - name: Remember the serving revision
        id: prev
        run: |
          set -euo pipefail
          prev="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // empty')" || prev=""
          echo "Serving now: ${prev:-<none>}"
          echo "revision=$prev" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=250 \
            --cpu-boost \
            --port=8080 \
            --timeout=60 \
            --add-cloudsql-instances="$CLOUDSQL_INSTANCE" \
            --env-vars-file="$RUNNER_TEMP/deploy.env.yaml" \
            --set-secrets="$RUN_SECRETS" \
            --tag candidate
          # SERBITO-430: the smoke and header checks use the tag URL candidate---…run.app. On the plain
          # run.app URL the app answers 301 to javi.serbito.rs or 403 (common/run_app_guard.py).
          # The last step removes the tag, also after a failure.
          # After a smoke rollback, traffic is pinned to the old revision by name; a plain deploy
          # would keep it there. Route 100% to the new revision (a no-op when already latest).
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest
        # One-time domain mapping (javi.serbito.rs -> service) — see SETUP_CICD.md.
        # Требуются Secret Manager секреты javi-secret-key, javi-database-url,
        # javi-google-maps-key, javi-infobip-key, javi-infobip-webhook-secret, javi-tasks-secret,
        # javi-sentry-dsn (Sentry, org nohandoff / project javi; release = javi@<тег без v>),
        # javi-admin-path (неочевидный путь админки, SERBITO-362; без него админки нет)
        # и роли runtime-SA: roles/cloudsql.client, roles/secretmanager.secretAccessor (на секреты),
        # roles/cloudtasks.enqueuer (постановка задач оценки в очередь javi-rating).
        # Deployer-SA: roles/run.admin (сервис и job) + roles/iam.serviceAccountUser (actAs RUNTIME_SA).
        # INFOBIP_BASE_URL/SENDER/CHANNEL, PUBLIC_BASE_URL, CLOUD_TASKS_* — из дефолтов settings.py.

      # SERBITO-401: smoke check after every deploy (release or refresh). The main page of the new
      # revision (the candidate tag URL, redirects followed) must return 200. Otherwise traffic goes
      # back to the revision that served before, and the run fails (GitHub e-mails the failure).
      - name: Smoke check (roll back on failure)
        env:
          PREV_REVISION: ${{ steps.prev.outputs.revision }}
        run: |
          set -euo pipefail
          SVC_URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          CAND_URL="https://candidate---${SVC_URL#https://}"
          for i in 1 2 3 4 5; do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 "$CAND_URL/")" || true
            echo "  smoke $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          if [ -z "$PREV_REVISION" ]; then
            echo "::error::The main page does not return 200, and there is no previous revision to roll back to."
            exit 1
          fi
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${PREV_REVISION}=100"
          echo "::error::The main page does not return 200 after the deploy. Traffic is back on $PREV_REVISION."
          exit 1

      # SERBITO-348: the landing and the app must keep their security headers (HSTS, nosniff,
      # framing ban, Referrer-Policy, CSP). Checked on the candidate tag URL (the landing at `/`,
      # no redirects). A missing header fails the run, but traffic stays on the new revision:
      # the site still works, and the fix is a code change. A refresh of a tag older than the
      # check has no script (and no landing headers yet), so the step skips it.
      - name: Security headers check
        run: |
          set -euo pipefail
          if [ ! -f scripts/check_security_headers.sh ]; then
            echo "::notice::$RELEASE_TAG has no scripts/check_security_headers.sh. Header check skipped."
            exit 0
          fi
          SVC_URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          CAND_URL="https://candidate---${SVC_URL#https://}"
          if ! bash scripts/check_security_headers.sh "$CAND_URL/"; then
            echo "::error::Security headers are missing on $CAND_URL/ (see the list above)."
            exit 1
          fi

      # SERBITO-430: the candidate tag URL is a way around Cloudflare, so it must not outlive the
      # deploy. Runs on success and on failure.
      - name: Remove the candidate tag
        if: always()
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags candidate \
            || echo "::warning::Could not remove the candidate tag. Remove it by hand: gcloud run services update-traffic $SERVICE --region $REGION --remove-tags candidate"
