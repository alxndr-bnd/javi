name: CI

# The release gate (same as scripts/release_minor.sh): ruff, manage.py check, pytest,
# landing parse. One definition, two callers (SERBITO-290):
#   - here, on every PR (incl. Dependabot) and every push to main, so nothing merges untested;
#   - deploy.yaml, via workflow_call, before every v*.*.* tag deploy.
# SERBITO-635: the image job builds the production image on every PR and push to main, so a
# broken image (base image, uv bump, Dockerfile) fails the PR, not the release. A tag run skips
# it: deploy.yaml builds and pushes the image itself.
# Runs on main also seed the uv cache: tag runs can restore caches from the default
# branch only (a tag's own cache is invisible to the next tag).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# actions/checkout runs `git init`; with no default branch configured, git prints a
# 10-line "Using 'master'" hint into the log. Set it for every git call (as SERBITO-530).
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify:
    runs-on: ubuntu-24.04 # явная версия: ubuntu-latest переезжает на 26.04 (2026-10-19)
    timeout-minutes: 10
    permissions:
      contents: read # no id-token: this job runs dependency and test code, never deploys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned: supply-chain, Aikido)
        with:
          persist-credentials: false # no step pushes; keep the token out of .git/config (SERBITO-385, Aikido)

      # One uv version for CI and the image (SERBITO-294): read it from the Dockerfile's pinned
      # uv stage, which Dependabot bumps. Never hardcode it here (config/test_dockerfile.py).
      - name: uv version from Dockerfile
        id: uv-version
        run: |
          version="$(sed -nE 's#^FROM ghcr\.io/astral-sh/uv:([0-9]+\.[0-9]+\.[0-9]+)@sha256:[0-9a-f]{64} AS uv$#\1#p' Dockerfile)"
          if [ -z "$version" ]; then echo "::error::no pinned uv stage in Dockerfile"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # uv + Python from .python-version; dependency and interpreter downloads cached,
      # keyed on uv.lock (the repo installs with uv, so this is the pip cache equivalent).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.2.0 (SHA-pinned)
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: Install dependencies (locked, incl. dev)
        run: uv sync --frozen
      # config/test_consent_focus.py drives full Chromium headless (real window focus events).
      # SERBITO-552: the browser download (~9 s) is cached, keyed on the locked playwright
      # version. `install --with-deps` still installs the OS packages and skips the download
      # when the cache has this version.
      - name: Playwright version from uv.lock
        id: playwright
        run: |
          version="$(uv run --frozen python -c 'import importlib.metadata as m; print(m.version("playwright"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (SHA-pinned)
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium for Playwright
        run: uv run --frozen playwright install --with-deps chromium

      # Tests use the sqlite fallback, exactly as locally: no DATABASE_URL, no .env.
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format --check
        run: uv run --frozen ruff format --check .
      - name: manage.py check
        run: uv run --frozen python manage.py check --fail-level WARNING
      - name: pytest
        run: uv run --frozen pytest
      - name: Landing HTML parses
        run: |
          test -s landing/index.html
          python3 -c "import html.parser; html.parser.HTMLParser().feed(open('landing/index.html',encoding='utf-8').read()); print('landing OK')"
      # SERBITO-613: warnings are failures. Known vulnerabilities in the locked dependencies
      # (any severity) and Dockerfile lint warnings fail the gate, as a failing test does.
      - name: pip-audit (locked dependencies)
        run: |
          uv export --frozen --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip \
            -r "$RUNNER_TEMP/requirements.txt"
      - name: Dockerfile lint (docker build --check)
        run: docker build --check .

  # SERBITO-635: the same image as deploy.yaml's "Build & push image" (context, Dockerfile,
  # APT_REFRESH build arg), built and never pushed. No registry login, no secrets, no id-token.
  # Layers are cached in the GitHub Actions cache. A PR reads the cache of its own branch and of
  # main; runs on main keep it warm. A tag run (deploy.yaml calls this workflow) skips the job.
  image:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04 # explicit: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    permissions:
      contents: read # build only: no push, no deploy
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false" # no build-record artifact per run; the summary stays
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned: supply-chain, Aikido)
        with:
          persist-credentials: false # no step pushes; keep the token out of .git/config (SERBITO-385, Aikido)

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (SHA-pinned)

      # As deploy.yaml (SERBITO-369): the UTC date, so the apt-get upgrade layer is fresh daily.
      - name: Daily apt refresh key
        id: apt
        run: echo "refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (SHA-pinned)
        with:
          context: .
          push: false
          load: true # into the runner's Docker, for the smoke step below
          tags: javi:ci
          build-args: |
            APT_REFRESH=${{ steps.apt.outputs.refresh }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gunicorn entry point (config.wsgi) imports in the built image. config/checks.py
      # refuses to serve without SECRET_KEY and ALLOWED_HOSTS: give it a throwaway key made in
      # this step (not a repo secret) and a reserved host name. No network, no database.
      - name: Smoke (import config.wsgi in the image)
        run: |
          docker run --rm --network none \
            -e SECRET_KEY="$(openssl rand -hex 32)" -e ALLOWED_HOSTS=ci.invalid \
            javi:ci python -c "import config.wsgi; print('config.wsgi imports')"
