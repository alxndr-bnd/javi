# Несекретные runtime env-переменные Cloud Run (читаемая замена ^@@^-флага).
# Секреты — отдельно через --set-secrets в deploy.yaml; SENTRY_RELEASE (javi@<тег>)
# дописывается к копии этого файла при деплое. Прочая конфигурация
# (INFOBIP_*, PUBLIC_BASE_URL, CLOUD_TASKS_*) берётся из дефолтов settings.py.
# DEBUG не задаём — дефолт settings.py уже False.
ALLOWED_HOSTS: "javi.serbito.rs,.run.app"
CSRF_TRUSTED_ORIGINS: "https://javi.serbito.rs"
STATICFILES_BACKEND: "whitenoise.storage.CompressedManifestStaticFilesStorage"
TASK_SCHEDULER: "tasks.scheduler.CloudTasksScheduler"
SECURE_SSL: "True"
# Бесплатные квоты (виджет в кабинете). Maps — реальный free tier Google (10000 вызовов/мес).
# Viber — остаток Infobip-триала НА 2026-06-07: 93 из 100 бесплатных (триал ~57 дней);
# счётчик считает наши отправки от 0, упрёмся в реальную сотню после ещё 93. SMS=0 → пока
# показываем только расход, без «осталось» (точное бесплатное число по SMS не задано).
FREE_QUOTA_MAPS: "10000"
FREE_QUOTA_VIBER: "93"
FREE_QUOTA_SMS: "0"
# SERBITO-467: recipient name/phone/address are erased this many days after a delivery is final.
# The privacy page (landing/privacy.html, sr/en/ru) states the same number — change both together.
RECIPIENT_PII_RETENTION_DAYS: "90"
# SERBITO-593: shop billing (Whop subscription, 30 €/month, 30 days free). Off until the owner
# creates the Whop product and webhook. Owner steps: docs/billing-whop.md. To switch on, in one
# commit: JAVI_BILLING_START_DATE (the go-live day), WHOP_SANDBOX "0", WHOP_COMPANY_ID,
# WHOP_PRODUCT_ID here, and WHOP_API_KEY / WHOP_WEBHOOK_SECRET in RUN_SECRETS (deploy.yaml).
JAVI_BILLING_ENABLED: "False"
